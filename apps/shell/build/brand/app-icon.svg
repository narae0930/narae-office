<?xml version="1.0" encoding="UTF-8"?>
<!--
  NARAE OFFICE app icon (source of truth).

  A four-petal flower on a blush tile, the mark of the NARAE OFFICE design:
  soft rose petals outlined in rose gold, each petal notched like a heart.

  Every raster/container icon in the repo is derived from this file:
    node tools/gen-brand-assets.mjs
  Keep the 1024x1024 canvas and the full-bleed rounded tile; the generator
  insets the whole drawing for the macOS variants.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs><linearGradient id="narae-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6f1"/><stop offset="1" stop-color="#f6d9d6"/></linearGradient></defs>
  <rect width="1024" height="1024" rx="230" fill="url(#narae-tile)"/>
  <g transform="translate(512 512) scale(1.16) translate(-512 -512)" fill="#f3c9cf" stroke="#c2896e" stroke-width="24" stroke-linejoin="round"><path transform="rotate(0 512 512)" d="M512 476C436 430 392 318 428 236C452 182 498 184 512 226C526 184 572 182 596 236C632 318 588 430 512 476Z"/><path transform="rotate(90 512 512)" d="M512 476C436 430 392 318 428 236C452 182 498 184 512 226C526 184 572 182 596 236C632 318 588 430 512 476Z"/><path transform="rotate(180 512 512)" d="M512 476C436 430 392 318 428 236C452 182 498 184 512 226C526 184 572 182 596 236C632 318 588 430 512 476Z"/><path transform="rotate(270 512 512)" d="M512 476C436 430 392 318 428 236C452 182 498 184 512 226C526 184 572 182 596 236C632 318 588 430 512 476Z"/></g><circle cx="512" cy="512" r="30" fill="#c2896e"/>
</svg>
